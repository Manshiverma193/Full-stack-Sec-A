services:

  mongodb:

    image: mongo:8

    container_name:
        campusconnect-mongodb

    restart:
        unless-stopped

    ports:
        - "27017:27017"

    volumes:
        - mongo_data:/data/db


  redis:

    image: redis:7-alpine

    container_name:
        campusconnect-redis

    restart:
        unless-stopped

    ports:
        - "6379:6379"


  backend:

    build:
        ./backend

    container_name:
        campusconnect-backend

    restart:
        unless-stopped

    ports:
        - "5000:5000"

    environment:

        PORT: 5000

        MONGO_URI:
            mongodb://mongodb:27017/campusconnect

        REDIS_URL:
            redis://redis:6379

        JWT_SECRET:
            campusconnect_secret

        REFRESH_SECRET:
            campusconnect_refresh_secret

        FRONTEND_URL:
            http://localhost:5173

    depends_on:

        - mongodb

        - redis


  frontend:

    build:
        ./frontend

    container_name:
        campusconnect-frontend

    restart:
        unless-stopped

    ports:
        - "5173:5173"

    depends_on:

        - backend


volumes:

    mongo_data:
